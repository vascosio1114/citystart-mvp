<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CityStart — City Guide</title>
  <link rel="stylesheet" href="./style.css" />
  <style>
    /* ===== Guide-specific styles ===== */
    .guide-nav {
      display: flex;
      gap: 10px;
      padding: 16px 28px 0;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 60%, #0f3460 100%);
    }
    .guide-nav a {
      color: rgba(255,255,255,0.6);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      padding: 8px 16px;
      border-radius: 8px 8px 0 0;
      transition: all 0.2s;
    }
    .guide-nav a:hover { color: white; background: rgba(255,255,255,0.1); }
    .guide-nav a.active { color: white; background: rgba(255,255,255,0.15); }

    .city-tabs {
      display: flex;
      gap: 8px;
      padding: 20px 20px 0;
      max-width: 1100px;
      margin: 0 auto;
    }
    .city-tab {
      padding: 10px 22px;
      border-radius: 10px 10px 0 0;
      border: 2px solid #e2e8f0;
      border-bottom: none;
      background: white;
      cursor: pointer;
      font-size: 15px;
      font-weight: 600;
      color: #9ca3af;
      transition: all 0.2s;
    }
    .city-tab.active { color: #1a1a2e; border-color: #1a1a2e; background: #f0f2f5; }

    .guide-body {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 20px 40px;
    }

    /* Section tabs */
    .section-tabs {
      display: flex;
      gap: 8px;
      margin: 24px 0 20px;
      flex-wrap: wrap;
    }
    .section-tab {
      padding: 8px 18px;
      border-radius: 999px;
      border: 2px solid #e2e8f0;
      background: white;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      color: #6b7280;
      transition: all 0.2s;
    }
    .section-tab.active { background: #1a1a2e; color: white; border-color: #1a1a2e; }

    /* Content sections */
    .content-section { display: none; }
    .content-section.active { display: block; }

    /* Intro banner */
    .intro-banner {
      background: linear-gradient(135deg, #667eea22, #764ba222);
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      padding: 18px 22px;
      margin-bottom: 24px;
      color: #374151;
      font-size: 15px;
      line-height: 1.6;
    }

    /* Food sub-sections */
    .food-section {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.05);
    }
    .food-section-title {
      font-size: 17px;
      font-weight: 700;
      margin: 0 0 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .food-items { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
    .food-item {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 13px 15px;
    }
    .food-item-name { font-weight: 700; font-size: 14px; margin-bottom: 4px; color: #111; }
    .food-item-desc { font-size: 13px; color: #4b5563; line-height: 1.45; }
    .food-tag {
      display: inline-block;
      margin-top: 6px;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 999px;
      background: #e0e7ff;
      color: #4338ca;
      font-weight: 600;
      text-transform: uppercase;
    }
    .food-tag.supermarket { background: #dcfce7; color: #166534; }
    .food-tag.tip { background: #fef3c7; color: #92400e; }
    .food-tag.local { background: #fce7f3; color: #9d174d; }
    .food-tag.market { background: #ede9fe; color: #5b21b6; }
    .food-tag.neighbourhood { background: #dbeafe; color: #1e40af; }
    .food-tag.landmark { background: #fee2e2; color: #991b1b; }

    /* Supermarket grid */
    .supermarket-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
    .supermarket-card {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.05);
      transition: box-shadow 0.2s, transform 0.15s;
    }
    .supermarket-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.1); transform: translateY(-1px); }
    .supermarket-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .supermarket-name { font-weight: 700; font-size: 16px; display: flex; align-items: center; gap: 8px; }
    .price-badge {
      font-size: 12px; font-weight: 700; padding: 3px 10px;
      border-radius: 999px; background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0;
    }
    .price-badge.mid { background: #fffbeb; color: #92400e; border-color: #fde68a; }
    .price-badge.high { background: #fef2f2; color: #991b1b; border-color: #fecaca; }
    .supermarket-desc { font-size: 13px; color: #4b5563; line-height: 1.45; margin-bottom: 10px; }
    .supermarket-tip {
      font-size: 12px; color: #6b7280;
      background: #f8fafc; border-radius: 8px; padding: 8px 10px;
      border-left: 3px solid #6366f1;
    }
    .supermarket-tip::before { content: "💡 "; }

    /* Life tips list */
    .life-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
    .life-card {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.05);
      display: flex;
      gap: 14px;
      align-items: flex-start;
    }
    .life-emoji { font-size: 28px; flex-shrink: 0; }
    .life-category { font-size: 11px; font-weight: 700; color: #6366f1; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
    .life-tip { font-size: 14px; color: #374151; line-height: 1.5; }

    /* Tips / 小紅書 style */
    .tips-grid { columns: 2; gap: 16px; }
    @media (max-width: 700px) { .tips-grid { columns: 1; } }
    .tip-card {
      break-inside: avoid;
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.05);
      transition: box-shadow 0.2s, transform 0.15s;
    }
    .tip-card:hover { box-shadow: 0 6px 20px rgba(0,0,0,0.1); transform: translateY(-2px); }
    .tip-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .tip-emoji-bubble {
      width: 44px; height: 44px;
      border-radius: 12px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; flex-shrink: 0;
    }
    .tip-tag {
      font-size: 11px; font-weight: 700; padding: 3px 9px;
      border-radius: 999px; background: #ede9fe; color: #5b21b6;
    }
    .tip-title { font-size: 15px; font-weight: 700; color: #111; margin-bottom: 8px; line-height: 1.3; }
    .tip-body { font-size: 14px; color: #4b5563; line-height: 1.55; }
    .tip-footer { display: flex; align-items: center; gap: 6px; margin-top: 12px; color: #9ca3af; font-size: 13px; }
    .tip-likes { display: flex; align-items: center; gap: 4px; }
    .tip-likes::before { content: "❤️"; font-size: 14px; }

    @media (max-width: 700px) {
      .food-items, .supermarket-grid, .life-grid { grid-template-columns: 1fr; }
      .city-tab { padding: 8px 14px; font-size: 13px; }
    }
  </style>
</head>
<body>

<header class="header">
  <div>
    <h1>🌍 CityStart — <span id="cityTitle">Toronto</span></h1>
    <p class="sub">Essential apps &amp; services for international students, curated by locals.</p>
  </div>
  <div class="controls">
    <select id="citySelect">
      <option value="toronto">🇨🇦 Toronto</option>
      <option value="london">🇬🇧 London</option>
      <option value="hongkong">🇭🇰 Hong Kong</option>
    </select>
  </div>
</header>

<!-- Page nav -->
<nav class="guide-nav">
  <a href="./index.html">📱 Apps & Services</a>
  <a href="./city-guide.html" class="active">🗺️ City Guide</a>
</nav>

<!-- City tabs -->
<div class="city-tabs">
  <button class="city-tab active" data-city="toronto">🇨🇦 Toronto</button>
  <button class="city-tab" data-city="london">🇬🇧 London</button>
  <button class="city-tab" data-city="hongkong">🇭🇰 Hong Kong</button>
</div>

<div class="guide-body">
  <!-- Section tabs -->
  <div class="section-tabs">
    <button class="section-tab active" data-section="food">🍜 Food</button>
    <button class="section-tab" data-section="supermarkets">🛒 Supermarkets</button>
    <button class="section-tab" data-section="life">🏠 Life Tips</button>
    <button class="section-tab" data-section="tips">✨ Student Tips</button>
  </div>

  <!-- Rendered content -->
  <div id="guide-content"></div>
</div>

<footer class="footer">
  <span>© 2026 CityStart · Built by <a href="https://github.com/vascosio1114" target="_blank">Vasco Sio</a></span>
</footer>

<script>
let DATA = null;
let currentCity = 'toronto';
let currentSection = 'food';

const cityTitles = { toronto: 'Toronto', london: 'London', hongkong: 'Hong Kong' };

async function loadData() {
  const res = await fetch('./data/city_guide.json');
  DATA = await res.json();
  render();
}

function render() {
  const city = DATA[currentCity];
  document.getElementById('cityTitle').textContent = cityTitles[currentCity];
  document.getElementById('citySelect').value = currentCity;
  const el = document.getElementById('guide-content');
  if (currentSection === 'food') el.innerHTML = renderFood(city.food);
  else if (currentSection === 'supermarkets') el.innerHTML = renderSupermarkets(city.supermarkets);
  else if (currentSection === 'life') el.innerHTML = renderLife(city.life);
  else if (currentSection === 'tips') el.innerHTML = renderTips(city.tips);
}

function renderFood(food) {
  return `
    <div class="intro-banner">${food.intro}</div>
    ${food.sections.map(sec => `
      <div class="food-section">
        <div class="food-section-title"><span>${sec.emoji}</span> ${sec.name}</div>
        <div class="food-items">
          ${sec.items.map(item => `
            <div class="food-item">
              <div class="food-item-name">${item.name}</div>
              <div class="food-item-desc">${item.desc}</div>
              <span class="food-tag ${item.tag}">${item.tag}</span>
            </div>
          `).join('')}
        </div>
      </div>
    `).join('')}
  `;
}

function renderSupermarkets(sm) {
  const priceClass = p => p === '$$$' ? 'high' : p === '$$' ? 'mid' : '';
  return `
    <div class="intro-banner">${sm.intro}</div>
    <div class="supermarket-grid">
      ${sm.items.map(item => `
        <div class="supermarket-card">
          <div class="supermarket-header">
            <div class="supermarket-name">${item.emoji} ${item.name}</div>
            <div class="price-badge ${priceClass(item.price)}">${item.price}</div>
          </div>
          <div class="supermarket-desc">${item.desc}</div>
          <div class="supermarket-tip">${item.tip}</div>
        </div>
      `).join('')}
    </div>
  `;
}

function renderLife(life) {
  return `
    <div class="intro-banner">${life.intro}</div>
    <div class="life-grid">
      ${life.items.map(item => `
        <div class="life-card">
          <div class="life-emoji">${item.emoji}</div>
          <div>
            <div class="life-category">${item.category}</div>
            <div class="life-tip">${item.tip}</div>
          </div>
        </div>
      `).join('')}
    </div>
  `;
}

function renderTips(tips) {
  const sorted = [...tips].sort((a, b) => b.likes - a.likes);
  return `
    <div class="tips-grid">
      ${sorted.map(tip => `
        <div class="tip-card">
          <div class="tip-header">
            <div class="tip-emoji-bubble">${tip.emoji}</div>
            <span class="tip-tag">${tip.tag}</span>
          </div>
          <div class="tip-title">${tip.title}</div>
          <div class="tip-body">${tip.body}</div>
          <div class="tip-footer">
            <span class="tip-likes">${tip.likes}</span>
          </div>
        </div>
      `).join('')}
    </div>
  `;
}

// City tabs
document.querySelectorAll('.city-tab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.city-tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentCity = btn.dataset.city;
    render();
  });
});

// Section tabs
document.querySelectorAll('.section-tab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.section-tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentSection = btn.dataset.section;
    render();
  });
});

// Header city select sync
document.getElementById('citySelect').addEventListener('change', e => {
  currentCity = e.target.value;
  document.querySelectorAll('.city-tab').forEach(b => {
    b.classList.toggle('active', b.dataset.city === currentCity);
  });
  render();
});

loadData();
</script>
</body>
</html>
